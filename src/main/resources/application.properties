spring.application.name=adoptr
server.port=${PORT:8081}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Development default; use versioned migrations and validate outside development.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

security.jwt.secret=${SECURITY_JWT_SECRET}
security.jwt.expiration=${SECURITY_JWT_EXPIRATION:3600000}

# Images. Credentials use the AWS default chain (AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY).
aws.region=${AWS_REGION:sa-east-1}
aws.s3.bucket=${AWS_S3_BUCKET:}
# Empty: the bucket's public URL. Set it when serving images from a CDN.
aws.s3.public-base-url=${AWS_S3_PUBLIC_BASE_URL:}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
# Read past the limit so an oversized upload gets a 413 instead of a dropped connection.
server.tomcat.max-swallow-size=20MB
